name: Deploy static demo to GitHub Pages

# GitHub Pages serves static files only, so the Python engine cannot run there.
# This publishes the SPA with a precomputed analysis bundled in — real output
# from the engine, generated by this workflow rather than committed stale.
#
# The full-stack deployment (live API, custom uploads, live Claude narratives)
# is the Vercel config in vercel.json.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never leave a half-published site: let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Regenerate the bundled analysis from the current engine so the published
      # demo can never drift from the code in the repo.
      - name: Precompute the demo analysis
        run: |
          python - <<'PY'
          import json, pathlib
          from backend.app import create_app

          client = create_app().test_client()
          txs = json.loads(pathlib.Path("data/demo_transactions.json").read_text())
          result = client.post("/api/analyze", json=txs).get_json()
          for case in result["cases"]:
              case["_summary"] = client.post("/api/summarize", json=case).get_json()

          out = json.dumps(result, indent=2) + "\n"
          pathlib.Path("frontend/src/data/fallbackCases.json").write_text(out)
          print(f"bundled {len(result['cases'])} cases")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Build
        working-directory: frontend
        env:
          # Pages serves from /<repo>/, not the domain root.
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_STATIC_DEMO: "true"
        run: npm run build

      # Pages 404s on a hard refresh without this; a copy of index.html is the
      # standard workaround for a static SPA.
      - name: Add SPA 404 fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
