name: CI

on:
  push:
    branches: [master, rebuild/v2]
  pull_request:

jobs:
  backend:
    name: Backend (lint, tests, evaluation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # No ANTHROPIC_API_KEY is configured on purpose: the suite must pass with
      # the template fallback, which proves the service degrades correctly
      # without a key rather than only working when one is present.
      - name: Tests
        run: pytest --cov=backend --cov-report=term-missing --cov-fail-under=85

      # Guards the accuracy claims in the README against silent drift.
      - name: Detection evaluation
        run: python scripts/evaluate.py

      # The serverless bundle must not regain pandas/numpy/scikit-learn.
      - name: Assert runtime dependencies stay slim
        run: |
          if grep -Eiq '^(pandas|numpy|scikit-learn|scipy)\b' requirements.txt; then
            echo "::error::A heavy dependency reappeared in requirements.txt"
            exit 1
          fi

  frontend:
    name: Frontend (tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # v1 shipped the MUI v5 Grid API on MUI v7, so the layout never split.
      - name: Assert no legacy MUI Grid API
        run: |
          if grep -rn "Grid item" src/; then
            echo "::error::Legacy MUI v5 Grid API found - use size={{ xs, md }}"
            exit 1
          fi

      # v1 hardcoded http://localhost:8000, which made the build undeployable.
      - name: Assert no hardcoded API host
        run: |
          if grep -rnE "https?://(localhost|127\.0\.0\.1):[0-9]+" src/ --include=*.jsx --include=*.js | grep -v "^\s*\*" | grep -v "//"; then
            echo "::error::Hardcoded API host found - use a relative /api path"
            exit 1
          fi
